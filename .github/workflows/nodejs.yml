name: Node.js CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  core:
    name: Core (lint + tests + round-trip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Set build metadata
        run: |
          BUILD_VERSION="$(node -e 'console.log(require("./package.json").version)')"
          echo "BUILD_VERSION=${BUILD_VERSION}" >> "$GITHUB_ENV"
          echo "BUILD_ID=${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Build cjs/es/umd
        run: |
          npm run build:dist
      - name: Audit production dependencies
        run: |
          npm run audit:prod
      - name: Lint
        run: npm run lint
      - name: Test (full suite)
        run: npm test
      - name: Round-trip test (Frame2Text, 130 cases)
        run: npm run test_frame2text
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Text2Frame-MV-${{ env.BUILD_VERSION }}-${{ github.run_number }}
          path: |
            dist/Frame2Text.js
            dist/Text2Frame.js
            dist/Text2Frame.cjs.js
            dist/Text2Frame.es.mjs
            dist/Text2Frame.umd.js
          if-no-files-found: error

  extension:
    name: VS Code extension (compile + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          cache: 'npm'
          cache-dependency-path: vscode-extension/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: vscode-extension
      - name: Compile (tsc)
        run: npm run compile
        working-directory: vscode-extension
      - name: Lint
        run: npm run lint
        working-directory: vscode-extension
      - name: Package VSIX
        run: |
          VERSION="$(node -e 'console.log(require("./package.json").version)')"
          npx @vscode/vsce package --out text2frame-language-support-${VERSION}.vsix
        working-directory: vscode-extension
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: vscode-extension-vsix-${{ github.run_number }}
          path: vscode-extension/text2frame-language-support-*.vsix
          if-no-files-found: error

  # リリース物を3つまとめて作り、一覧(MANIFEST.txt)ごと artifact に上げる。
  # 手元の `npm run pack:all` と同じ tools/pack-all.sh を呼ぶので、CI で採れたものと
  # 手元で作ったものが同じ手順・同じ検証を通っていることが保証される。
  # 検査は core / extension ジョブが済ませているので --skip-tests で二度手間を避ける。
  package:
    name: Package all artifacts
    needs: [core, extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          cache: 'npm'
      - name: Install dependencies (core)
        run: npm ci
      - name: Install dependencies (extension)
        run: npm ci
        working-directory: vscode-extension
      - name: Pack all
        run: npm run pack:all -- --skip-tests
      - name: Summary
        run: |
          {
            echo '## リリース物'
            echo
            echo '```'
            cat release/MANIFEST.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.run_number }}
          path: release/
          if-no-files-found: error
